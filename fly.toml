app = 'aibuilder-api'
primary_region = 'iad'

[build]

[env]
  PORT = '8000'
  OLLAMA_MODEL = 'gemma4:31b'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
