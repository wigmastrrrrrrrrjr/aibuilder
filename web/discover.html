<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discover — aibuilder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css?v=49">
  <script>(function(){try{var t=localStorage.getItem("ab.theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}})();</script>
</head>
<body class="discoverBody">
<header id="discoverHeader">
  <a href="index.html" class="logo"><span>aibuilder</span></a>
  <span style="font-size:13px">Apps built by the community</span>
</header>

<div class="discoverHero">
  <h1>Discover</h1>
  <p>Live previews of apps built and published with aibuilder. Open any app to play with it, or remix it into your own editable copy.</p>

  <div class="discToolbar">
    <label class="discSearch" for="discSearch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input id="discSearch" type="search" placeholder="Search apps…" autocomplete="off">
    </label>
    <select id="discSort" class="discSort" aria-label="Sort apps">
      <option value="new">Newest first</option>
      <option value="az">A → Z</option>
    </select>
    <a class="discCta" href="index.html">Build an app</a>
  </div>
  <div class="discMeta"><span class="discCount" id="discCount"></span></div>
</div>

<main id="discoverGrid" aria-live="polite"></main>

<footer class="siteFoot">
  <a class="logo" href="index.html"><span>aibuilder</span></a>
  <span class="footSep">·</span>
  <a class="footBtn" href="forum.html">Forum</a>
  <span class="footSep">·</span>
  <a class="footBtn" href="tos.html" target="_blank" rel="noopener">Terms of Service</a>
  <a class="footBtn" href="tou.html" target="_blank" rel="noopener">Terms of Use</a>
  <a class="footBtn" href="privacy.html" target="_blank" rel="noopener">Privacy</a>
</footer>
<script src="discover.js?v=9"></script>
</body>
</html>
