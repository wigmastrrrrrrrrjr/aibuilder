name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'aibuilderapi/scripts/shutdown-site.mjs'
      - 'aibuilderapi/src/shutdown.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The site is shut down: publish the shutdown page instead of the app.
      # Sources under web/ are untouched, so removing this step restores the
      # mirror exactly as it was.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage the shutdown page
        run: |
          rm -rf .pages-site
          mkdir -p .pages-site
          cp -r web/. .pages-site/
          node aibuilderapi/scripts/shutdown-site.mjs .pages-site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site

      - id: deployment
        uses: actions/deploy-pages@v4
