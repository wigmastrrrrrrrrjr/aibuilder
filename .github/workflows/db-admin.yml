name: D1 admin (manual only)

# Manually-triggered D1 query/cleanup tool. Never runs on push.
# Requires confirm=RUN so nothing destructive fires by accident.
on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Short label for this run (shown in the run name)'
        required: false
        default: 'query'
      sql:
        description: 'SQL to execute against aibuildersehdatabase (remote)'
        required: true
      confirm:
        description: 'Type RUN to execute, or anything else to abort'
        required: true
        default: 'ABORT'

permissions:
  contents: read

jobs:
  d1:
    if: github.event.inputs.confirm == 'RUN'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: aibuilderapi
        run: npm install --no-audit --no-fund

      - name: Write query
        env:
          SQL: ${{ github.event.inputs.sql }}
        run: printf '%s\n' "$SQL" > "$RUNNER_TEMP/query.sql"

      - name: Execute on remote D1
        working-directory: aibuilderapi
        run: npx wrangler d1 execute aibuildersehdatabase --remote --json --file="$RUNNER_TEMP/query.sql"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
