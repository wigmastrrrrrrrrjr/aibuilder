name: Deploy aibuilder

on:
  push:
    branches: [main]
    paths:
      - 'aibuilderapi/**'
      - 'web/**'
      - 'schema.sql'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: aibuilderapi
        run: npm install --no-audit --no-fund

      - name: Apply D1 schema (idempotent)
        working-directory: aibuilderapi
        run: npx wrangler d1 execute aibuilder --remote --file=../schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Ollama key (only if GH secret OLLAMA_API_KEY is set)
        working-directory: aibuilderapi
        run: |
          if [ -n "$OLLAMA_API_KEY" ]; then
            printf '%s' "$OLLAMA_API_KEY" | npx wrangler secret put OLLAMA_API_KEY
          else
            echo "GitHub secret OLLAMA_API_KEY not configured — keeping existing worker secret"
          fi
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker + assets
        working-directory: aibuilderapi
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
