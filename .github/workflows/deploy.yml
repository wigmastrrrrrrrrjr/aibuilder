name: Deploy aibuilder to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: aibuilderapi
        run: npm install --no-audit --no-fund

      - name: Apply D1 schema (idempotent)
        working-directory: aibuilderapi
        run: npx wrangler d1 execute aibuildersehdatabase --remote --file=../schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Ollama key
        working-directory: aibuilderapi
        run: |
          if [ -n "$OLLAMA_API_KEY" ]; then
            printf '%s' "$OLLAMA_API_KEY" | npx wrangler secret put OLLAMA_API_KEY
          else
            echo "OLLAMA_API_KEY secret not set — skipping"
          fi
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Mistral key
        working-directory: aibuilderapi
        run: |
          if [ -n "$MISTRAL_API_KEY" ]; then
            printf '%s' "$MISTRAL_API_KEY" | npx wrangler secret put MISTRAL_API_KEY
          else
            echo "MISTRAL_API_KEY secret not set — skipping"
          fi
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Supabase service key
        working-directory: aibuilderapi
        run: |
          if [ -n "$SUPABASE_SERVICE_KEY" ]; then
            printf '%s' "$SUPABASE_SERVICE_KEY" | npx wrangler secret put SUPABASE_SERVICE_KEY
          else
            echo "SUPABASE_SERVICE_KEY secret not set — skipping"
          fi
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync EmailJS secrets
        working-directory: aibuilderapi
        run: |
          for var in EMAILJS_PUBLIC_KEY EMAILJS_SERVICE_ID EMAILJS_TEMPLATE_ID EMAILJS_PRIVATE_KEY; do
            val=$(eval echo \$$var)
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put $var
            else
              echo "$var secret not set — skipping"
            fi
          done
        env:
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync reCAPTCHA secret
        working-directory: aibuilderapi
        run: |
          if [ -n "$RECAPTCHA_SECRET" ]; then
            printf '%s' "$RECAPTCHA_SECRET" | npx wrangler secret put RECAPTCHA_SECRET
          else
            echo "RECAPTCHA_SECRET not set — skipping"
          fi
        env:
          RECAPTCHA_SECRET: ${{ secrets.RECAPTCHA_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker + assets
        working-directory: aibuilderapi
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
