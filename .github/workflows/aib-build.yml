name: Build & release aib (terminal client)

on:
  push:
    paths:
      - "tui/**"
      - ".github/workflows/aib-build.yml"
      - "web/install.sh"
      - "web/install.ps1"
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aib-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tui/target
          key: aib-test-cargo-${{ hashFiles('tui/Cargo.toml', 'tui/Cargo.lock') }}
          restore-keys: |
            aib-test-cargo-

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests (SSE parser, materialize path-guard)
        working-directory: tui
        run: cargo test

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: ubuntu-latest
            target: aarch64-linux-android
            cross: true
            plan: aarch64-linux-android@26
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tui/target
          key: aib-${{ matrix.target }}-cargo-${{ hashFiles('tui/Cargo.toml', 'tui/Cargo.lock') }}
          restore-keys: |
            aib-${{ matrix.target }}-cargo-

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compiler
        if: matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.plan || matrix.target }}

      - name: Build release binary
        working-directory: tui
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary with canonical name
        shell: bash
        run: |
          mkdir -p dist
          cp "tui/target/${{ matrix.target }}/release/aib${{ matrix.ext }}" "dist/aib-${{ matrix.target }}${{ matrix.ext }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aib-${{ matrix.target }}${{ matrix.ext }}
          path: dist/aib-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true

      - name: Show staged files
        run: ls -la bin/

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aib-latest
          name: aib — latest build
          body: |
            Auto-built from main (${{ github.sha }}). Install with:

            curl -fsSL https://wigmastrrrrrrrrjr.github.io/aibuilder/install.sh | sh

            Manual download: https://github.com/wigmastrrrrrrrrjr/aibuilder/releases/latest
          files: bin/*
          fail_on_unmatched_files: true
          update_only: false
          allow_updates: true
          update_release_body: true