# Cloudflare deployment for aibuilderapi (the API package).
# Local dev does NOT use wrangler: run `npm start` here instead.
#
# Deploy steps:
#   1. npx wrangler d1 execute aibuildersehdatabase --remote --file=../schema.sql
#   2. npx wrangler secret put OLLAMA_API_KEY
#   3. npx wrangler secret put SUPABASE_SERVICE_KEY
#   4. npx wrangler deploy          (API on Workers, web/ served via Assets)

name = "aibuilderapi"
main = "src/worker.js"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "aibuildersehdatabase"
database_id = "637d0000-61e9-4e4d-9332-418b2669cdd1"

# Serve the SPA from the same worker (no separate Pages project needed)
[assets]
directory = "../web"
binding = "ASSETS"

[vars]
OLLAMA_MODEL = "gemma4:31b"
SUPABASE_URL = "https://trwxpgmkpaddnyktbleg.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyd3hwZ21rcGFkZG55a3RibGVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MzE3NjIsImV4cCI6MjEwMzIwNzc2Mn0.nJJUwuhMNq_8-3ShvpEUhkVz_DLPVklIid5BVSO8GDE"

[observability]
enabled = true
head_sampling_rate = 1
