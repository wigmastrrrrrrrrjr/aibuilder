# Dedicated builder/API worker — mirrors the whole app and serves the heavy
# surface the router offloads: /api/chat (main + workspace AI generation),
# /api/baas (BaaS auto-save), /api/terminal (AI shell), /api/v2, /api/projects
# (incl. live/presence/snapshots/upload) and /api/models.
# Shares the same D1 database and env as the main worker.
#
# Deploy:  npm run deploy:chat
# The chat worker reads the same secrets as the main worker. Mirror them once:
#   npx wrangler secret put OLLAMA_API_KEY       -c wrangler.chat.toml
#   npx wrangler secret put MISTRAL_API_KEY      -c wrangler.chat.toml
#   npx wrangler secret put LOCAL_OLLAMA_URL     -c wrangler.chat.toml
#   npx wrangler secret put SUPABASE_SERVICE_KEY -c wrangler.chat.toml
#   npx wrangler secret put OPENROUTER_API_KEY   -c wrangler.chat.toml

name = "aibuilderapi-chat"
main = "src/worker-chat.js"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "aibuildersehdatabase"
database_id = "637d0000-61e9-4e4d-9332-418b2669cdd1"

