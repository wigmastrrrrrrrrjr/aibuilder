# Dedicated builder/API worker — mirrors the whole app and serves the heavy
# surface the router offloads: /api/chat (main + workspace AI generation),
# /api/baas (BaaS auto-save), /api/terminal (AI shell), /api/v2, /api/projects
# (incl. live/presence/snapshots/upload) and /api/models.
# Shares the same D1 database and env as the main worker.
#
# Deploy:  npm run deploy:chat
# The chat worker reads the same secrets as the main worker. Mirror them once:
#   npx wrangler secret put OLLAMA_API_KEY       -c wrangler.chat.toml
#   npx wrangler secret put MISTRAL_API_KEY      -c wrangler.chat.toml
#   npx wrangler secret put LOCAL_OLLAMA_URL     -c wrangler.chat.toml
#   npx wrangler secret put SUPABASE_SERVICE_KEY -c wrangler.chat.toml
#   npx wrangler secret put OPENROUTER_API_KEY   -c wrangler.chat.toml

name = "aibuilderapi-chat"
main = "src/worker-chat.js"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "aibuildersehdatabase"
database_id = "637d0000-61e9-4e4d-9332-418b2669cdd1"

[vars]
OLLAMA_MODEL = "gemma4:31b"
SUPABASE_URL = "https://trwxpgmkpaddnyktbleg.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyd3hwZ21rcGFkZG55a3RibGVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MzE3NjIsImV4cCI6MjEwMzIwNzc2Mn0.nJJUwuhMNq_8-3ShvpEUhkVz_DLPVklIid5BVSO8GDE"
# CONTENT_ENC_KEY and FORUM_ADMIN_KEY are NOT set here on purpose.
# Both were previously committed in plaintext and must be treated as
# compromised. They now live only in Wrangler secret storage:
#   npx wrangler secret put CONTENT_ENC_KEY
#   npx wrangler secret put FORUM_ADMIN_KEY
# deploy.yml mirrors them from GitHub Actions secrets on every deploy.
# Removing them from [vars] is only safe once the rotated values are in place:
# encrypt.js silently passes plaintext through when CONTENT_ENC_KEY is absent.
KAGGLE_RELAY_URL = "https://aibuilderapi.csomeone301.workers.dev"

[observability]
enabled = true
head_sampling_rate = 1